[package]
name = "goose-providers"
version = "0.1.0-alpha.9"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[features]
default = []
rustls-tls = [
    "reqwest/rustls",
    "rmcp/reqwest",
    "tokio-tungstenite?/rustls-tls-webpki-roots",
]
test-utils = []
live-websocket = ["dep:tokio-tungstenite", "dep:http"]

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
goose-provider-types = { version = "0.1.0-alpha.9", path = "../goose-provider-types", default-features = false }
reqwest = { workspace = true }
rmcp = { workspace = true, features = ["server", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["io-util"] }
tokio-util = { workspace = true, features = ["compat"] }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
base64 = { workspace = true }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"], optional = true }
http = { workspace = true, optional = true }
include_dir = { workspace = true }

[dev-dependencies]
test-case = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }
tokio-stream = { workspace = true }
env-lock = { workspace = true }
wiremock.workspace = true
flate2 = "1.1.9"
reqwest = { workspace = true, features = ["gzip"] }

[[example]]
name = "streaming"
required-features = ["rustls-tls"]

[[example]]
name = "openai_live"
required-features = ["live-websocket", "rustls-tls"]
