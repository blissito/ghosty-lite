[package]
name = "ghosty-telemetry"
version = "1.48.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Conteo anónimo de uso de Ghosty, desactivable por el usuario"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
fd-lock = "4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
